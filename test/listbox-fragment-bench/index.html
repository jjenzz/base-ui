<!doctype html>
<html><head><meta charset="utf-8" /><title>Listbox bench</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  .list { height: 320px; width: 260px; overflow: auto; position: relative; }
  .list::after { content: ''; display: block; height: var(--total-size, 0px); }
  .item { position: absolute; top: 0; left: 0; width: 100%; height: 32px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; }
  .item[data-highlighted] { background: #eee; }
  .item[data-selected] { background: #111; color: #fff; }
  .item[data-disabled] { color: #999; }
</style></head>
<body><button data-outside>Outside</button><div id="root"></div>
<script type="module" src="/src/main.tsx"></script></body></html>
